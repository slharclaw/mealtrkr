[project]
name = "recipe-tracker"
version = "1.0.0"
description = "A REST API for tracking recipes with ingredients and directions"
authors = ["Your Name"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
]
requires-python = ">=3.11"

[project.scripts]
recipe-tracker = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
